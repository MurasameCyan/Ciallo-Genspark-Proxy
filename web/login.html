<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Ciallo Genspark Proxy</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-shell">
  <main class="login-card">
    <p class="eyebrow">CONTROL PLANE</p>
    <h1>Ciallo · Genspark Proxy</h1>
    <p>登录控制台后管理账号、注册任务与临时邮箱配置。</p>
    <form id="login-form">
      <label>用户名<input id="user" name="user" autocomplete="username" required value="admin"></label>
      <label>密码<input id="pass" name="pass" type="password" autocomplete="current-password" required></label>
      <p id="error" role="alert"></p>
      <button class="button button-primary" type="submit">登录</button>
    </form>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
